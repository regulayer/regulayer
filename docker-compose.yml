services:
  # ============================================================================
  # DATA LAYER
  # ============================================================================
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Init script will create the 3 databases
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # CORE TRUST LAYER (The Truth)
  # ============================================================================
  recorder:
    build:
      context: ./regulayer-recorder
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${RECORDER_DB_URL}
      - SIGNING_KEY_PATH=${RECORDER_SIGNING_KEY_PATH}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY}
      - RECORDER_ENVIRONMENT=dev
    volumes:
      - recorder_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8300:8000"

  # ============================================================================
  # PUBLIC INGESTION LAYER
  # ============================================================================
  gateway:
    build:
      context: ./regulayer-ingestion-gateway
      dockerfile: Dockerfile
    environment:
      - GATEWAY_PORT=8080
      - GATEWAY_CONTROL_PLANE_URL=http://control-plane:8000
      - GATEWAY_RECORDER_URL=http://recorder:8000
      - GATEWAY_GOVERNANCE_URL=http://governance:8002
      - GATEWAY_REPORTS_URL=http://reports:8003
      - GATEWAY_REDIS_URL=redis://redis:6379
      - GATEWAY_DEFAULT_DAILY_QUOTA=10000
    ports:
      - "8080:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      retries: 5

  # ============================================================================
  # ASYNC PROCESSING LAYER
  # ============================================================================
  queue-worker:
    build:
      context: ./regulayer-ingestion-queue
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL}
      - RECORDER_URL=http://recorder:8000
      - QUEUE_QUEUE_BACKEND=redis
    depends_on:
      redis:
        condition: service_healthy
      recorder:
        condition: service_healthy

  # ============================================================================
  # CONTROL & GOVERNANCE LAYER
  # ============================================================================
  control-plane:
    build:
      context: ./regulayer-control-plane
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${CONTROL_DB_URL}
      - REGULAYER_CONTROL_JWT_SECRET=${JWT_SECRET}
      - REGULAYER_CONTROL_STRIPE_API_KEY=${STRIPE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      retries: 5
    ports:
      - "8100:8000"

  governance:
    build:
      context: ./regulayer-governance
      dockerfile: Dockerfile
    expose:
      - "8002"
    environment:
      - DATABASE_URL=${GOVERNANCE_DB_URL}
      - GOVERNANCE_INTERNAL_SECRET=${GOVERNANCE_INTERNAL_SECRET:-regulayer_internal_secret_value_change_in_prod}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 10s
      retries: 5

  reports:
    build:
      context: ./regulayer-reports
      dockerfile: Dockerfile
    environment:
      - RECORDER_URL=http://recorder:8000
      - GOVERNANCE_URL=http://governance:8002
    depends_on:
      recorder:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 10s
      retries: 5

  incidents:
    build:
      context: ./regulayer-incidents
      dockerfile: Dockerfile
    environment:
      - INCIDENTS_DB_URL=${INCIDENTS_DB_URL}
      - INCIDENTS_INTERNAL_SECRET=${INCIDENTS_INTERNAL_SECRET:-regulayer_internal_secret_value_change_in_prod}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      retries: 5

  # ============================================================================
  # FRONTEND
  # ============================================================================
  web:
    build:
      context: ./regulayer-web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
    ports:
      - "3000:3000"
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  postgres_data:
  recorder_keys:
