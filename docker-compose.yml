services:
  # ============================================================================
  # DATA LAYER
  # ============================================================================
  redis:
    image: redis:7
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  # ============================================================================
  # CORE TRUST LAYER (The Truth)
  # ============================================================================
  recorder:
    build:
      context: ./regulayer-recorder
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${RECORDER_DB_URL}
      - SIGNING_KEY_PATH=${RECORDER_SIGNING_KEY_PATH}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY}
      - RECORDER_ENVIRONMENT=prod
    volumes:
      - recorder_keys:/keys
    ports:
      - "8300:8000"

  # ============================================================================
  # PUBLIC INGESTION LAYER
  # ============================================================================
  gateway:
    build:
      context: ./regulayer-ingestion-gateway
      dockerfile: Dockerfile
    environment:
      - GATEWAY_PORT=8080
      - GATEWAY_CONTROL_PLANE_URL=http://control-plane:8000
      - GATEWAY_RECORDER_URL=http://recorder:8000
      - GATEWAY_GOVERNANCE_URL=http://governance:8002
      - GATEWAY_REPORTS_URL=http://reports:8003
      - GATEWAY_REDIS_URL=redis://redis:6379
      - GATEWAY_DEFAULT_DAILY_QUOTA=10000
    ports:
      - "8080:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      retries: 5

  # ============================================================================
  # ASYNC PROCESSING LAYER
  # ============================================================================
  queue-worker:
    build:
      context: ./regulayer-ingestion-queue
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - RECORDER_URL=http://recorder:8000
      - QUEUE_QUEUE_BACKEND=redis
    depends_on:
      redis:
        condition: service_healthy
      recorder:
        condition: service_started

  # ============================================================================
  # CONTROL & GOVERNANCE LAYER
  # ============================================================================
  control-plane:
    build:
      context: ./regulayer-control-plane
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${CONTROL_DB_URL}
      - REGULAYER_CONTROL_JWT_SECRET=dev_jwt_secret_do_not_use_in_prod
      - REGULAYER_CONTROL_STRIPE_API_KEY=mock_stripe_key
      - INTERNAL_SECRET=${CONTROL_PLANE_INTERNAL_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      retries: 5
    ports:
      - "8100:8000"

  governance:
    build:
      context: ./regulayer-governance
      dockerfile: Dockerfile
    expose:
      - "8002"
    environment:
      - DATABASE_URL=${GOVERNANCE_DB_URL}
      - GOVERNANCE_INTERNAL_SECRET=${GOVERNANCE_INTERNAL_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 10s
      retries: 5

  reports:
    build:
      context: ./regulayer-reports
      dockerfile: Dockerfile
    environment:
      - RECORDER_URL=http://recorder:8000
      - GOVERNANCE_URL=http://governance:8002
    depends_on:
      recorder:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 10s
      retries: 5

  incidents:
    build:
      context: ./regulayer-incidents
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${INCIDENTS_DB_URL}
      - INCIDENTS_INTERNAL_SECRET=${INCIDENTS_INTERNAL_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      retries: 5

  # ============================================================================
  # FRONTEND
  # ============================================================================
  web:
    build:
      context: ./regulayer-web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      control-plane:
        condition: service_healthy

volumes:
  recorder_keys:
