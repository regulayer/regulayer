[project]
name = "regulayer-proof-verifier"
version = "1.0.0"
description = "Offline verification tool for Regulayer proof bundles"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "cryptography>=41.0"
]

[project.scripts]
regulayer = "cli.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
