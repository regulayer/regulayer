events {}

http {
    upstream control_plane {
        server control-plane:8000;
    }

    upstream gateway {
        server gateway:8080;
    }
    
    upstream web {
        server web:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name regulayer.tech app.regulayer.tech api.regulayer.tech;
        return 301 https://$host$request_uri;
    }

    # API Domain (api.regulayer.tech)
    server {
        listen 443 ssl;
        server_name api.regulayer.tech;

        ssl_certificate /etc/letsencrypt/live/regulayer.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/regulayer.tech/privkey.pem;

        # Control Plane Routes
        location /v1/auth { proxy_pass http://control_plane; }
        location /v1/orgs { proxy_pass http://control_plane; }
        location /v1/projects { proxy_pass http://control_plane; }
        
        # Gateway Routes (Ingestion & Public Read)
        location /v1/ingest { proxy_pass http://gateway; }
        location /v1/decisions { proxy_pass http://gateway; }
        location /v1/verifier { proxy_pass http://gateway; }
        
        # Billing Webhook
        location /v1/billing/webhook { proxy_pass http://control_plane; }
    }

    # App Domain (app.regulayer.tech)
    server {
        listen 443 ssl;
        server_name app.regulayer.tech;

        ssl_certificate /etc/letsencrypt/live/regulayer.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/regulayer.tech/privkey.pem;

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
