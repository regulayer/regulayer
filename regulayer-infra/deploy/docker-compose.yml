version: '3.8'

# Regulayer Production Deployment
# All services stateless, horizontal scaling safe

services:
  # ============================================================
  # Core Services
  # ============================================================

  control-plane:
    build: ../regulayer-control-plane
    ports:
      - "8100:8100"
    environment:
      - REGULAYER_ENV=prod
      - DATABASE_URL=postgresql://regulayer:${DB_PASSWORD}@postgres:5432/regulayer
      - REGULAYER_SECRET_SOURCE=environment
      - REGULAYER_SIGNING_KEY=${SIGNING_KEY}
      - REGULAYER_HMAC_KEY=${HMAC_KEY}
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8100/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  recorder:
    build: ../regulayer-recorder
    ports:
      - "8000:8000"
    environment:
      - REGULAYER_ENV=prod
      - DATABASE_URL=postgresql://regulayer:${DB_PASSWORD}@postgres:5432/regulayer
      - CONTROL_PLANE_URL=http://control-plane:8100
      - REGULAYER_SIGNING_KEY=${SIGNING_KEY}
    depends_on:
      - postgres
      - control-plane
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      # IMPORTANT: Recorder is single-writer for chain integrity
      # Horizontal scaling requires partition key strategy
      replicas: 1
      resources:
        limits:
          memory: 512M

  governance:
    build: ../regulayer-governance
    ports:
      - "8001:8001"
    environment:
      - REGULAYER_ENV=prod
      - DATABASE_URL=postgresql://regulayer:${DB_PASSWORD}@postgres:5432/regulayer
      - CONTROL_PLANE_URL=http://control-plane:8100
    depends_on:
      - postgres
      - control-plane
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M

  verifier-api:
    build: ../regulayer-verifier-ui/backend
    ports:
      - "8200:8200"
    environment:
      - REGULAYER_ENV=prod
      - DATABASE_URL=postgresql://regulayer:${DB_PASSWORD}@postgres:5432/regulayer
    depends_on:
      - postgres
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M

  # ============================================================
  # Infrastructure
  # ============================================================

  infra-api:
    build: ../regulayer-infra
    ports:
      - "8300:8300"
    environment:
      - REGULAYER_ENV=prod
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8300/v1/system/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1

  # ============================================================
  # Database
  # ============================================================

  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=regulayer
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=regulayer
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U regulayer" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================================
  # Load Balancer (Production)
  # ============================================================

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - control-plane
      - recorder
      - governance
      - verifier-api

volumes:
  postgres_data:


networks:
  default:
    driver: bridge
