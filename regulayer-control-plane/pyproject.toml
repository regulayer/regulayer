[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regulayer-control-plane"
version = "1.0.0"
description = "Multi-tenant SaaS control plane for Regulayer"
authors = [{name = "Regulayer Team", email = "dev@regulayer.ai"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "email-validator>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
