[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regulayer-control-plane"
version = "1.0.0"
description = "Multi-tenant SaaS control plane for Regulayer"
authors = [{name = "Regulayer Team", email = "dev@regulayer.ai"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "uvicorn[standard]",
    "pydantic[email]",
    "python-multipart",
    "stripe",
    "httpx",
    "python-jose",
    "passlib[bcrypt]",
    "pydantic-settings",
    "aiosmtplib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
