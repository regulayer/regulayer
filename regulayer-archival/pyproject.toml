[project]
name = "regulayer-archival"
version = "1.0.0"
description = "Long-term evidence retention and trust durability for Regulayer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
