[project]
name = "regulayer-billing"
version = "1.0.0"
description = "Billing and commercial enforcement for Regulayer SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.27.0",
    "stripe>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
