[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulayer"
version = "2.0.0"
description = "Record provable AI decisions with tamper-detectable audit trails"
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Regulayer", email = "support@regulayer.tech"}
]
keywords = ["ai", "governance", "audit", "compliance", "decisions", "provable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]
dependencies = [
    "httpx>=0.24.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-httpx>=0.21",
]

[project.urls]
Homepage = "https://regulayer.tech"
Documentation = "https://docs.regulayer.tech/python"
Repository = "https://github.com/regulayer/regulayer-python"
"Bug Tracker" = "https://github.com/regulayer/regulayer-python/issues"

[tool.setuptools.packages.find]
include = ["regulayer*"]
