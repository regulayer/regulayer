[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regulayer-ingestion-queue"
version = "1.0.0"
description = "Async ingestion queue for Regulayer"
authors = [{name = "Regulayer Team", email = "dev@regulayer.ai"}]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
