[project]
name = "regulayer-reports"
version = "1.0.0"
description = "Regulator-facing static trust reports for Regulayer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=60.0",
    "jinja2>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
