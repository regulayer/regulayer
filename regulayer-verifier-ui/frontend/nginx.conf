server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests if needed, though usually handled by env vars calling full URL
    # But good practice to safeguard
    location /error.html {
        internal;
    }
}
