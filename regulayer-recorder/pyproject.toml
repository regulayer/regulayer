[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regulayer-recorder"
version = "1.0.0"
description = "Regulayer Decision Recorder - Authoritative Backend Service"
authors = [{name = "Regulayer Team", email = "dev@regulayer.ai"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=41.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "regulayer_attestation*"]
